<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laporan Rekam Medis Bulanan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.2.0/chartjs-plugin-datalabels.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/JsBarcode/3.11.5/JsBarcode.all.min.js"></script>
<style>
  :root{
    --bg:#EEF0E9;
    --bg-warm:#E7EADF;
    --card:#FFFFFF;
    --ink:#182524;
    --ink-soft:#4A5A56;
    --primary:#14524E;
    --primary-dk:#0D3835;
    --primary-light:#DCEAE7;
    --accent:#B8722E;
    --accent-light:#F3E3CD;
    --danger:#A13D3D;
    --danger-light:#F5DEDE;
    --ok:#2E7D5B;
    --ok-light:#DCEEE3;
    --border:#D5D9CC;
    --shadow: 0 1px 2px rgba(20,30,28,0.06), 0 4px 14px rgba(20,30,28,0.05);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',sans-serif;font-size:14px;-webkit-font-smoothing:antialiased;}
  h1,h2,h3,.display{font-family:'Fraunces',serif;}
  .mono{font-family:'IBM Plex Mono',monospace; font-variant-numeric: tabular-nums;}
  .app{display:flex;min-height:100vh;}

  /* ===== SIDEBAR - folder tab metaphor ===== */
  .sidebar{
    width:230px; flex-shrink:0; background:var(--primary-dk);
    color:#EAF3F1; padding:22px 0 22px 0; position:sticky; top:0; height:100vh; overflow-y:auto;
  }
  .brand{padding:0 20px 18px 20px; border-bottom:1px solid rgba(255,255,255,0.12); margin-bottom:10px;}
  .brand .tag{font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:#9FC4BE; margin-bottom:4px;}
  .brand h1{font-size:19px; margin:0; font-weight:600; line-height:1.25; color:#fff;}
  .brand input{width:100%; margin-top:8px; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.18); color:#fff; padding:6px 8px; border-radius:4px; font-size:12px; font-family:'IBM Plex Sans',sans-serif;}
  .brand input::placeholder{color:#9FC4BE;}
  .brand textarea{width:100%; margin-top:6px; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.18); color:#fff; padding:6px 8px; border-radius:4px; font-size:10.5px; font-family:'IBM Plex Sans',sans-serif; resize:vertical; min-height:44px; line-height:1.4;}
  .brand textarea::placeholder{color:#9FC4BE;}
  .accesstime{padding:8px 18px; font-size:10px; color:#9FC4BE; line-height:1.5; border-bottom:1px solid rgba(255,255,255,0.12);}
  .liveclock{padding:8px 18px; font-size:10.5px; color:#EAF3F1; font-family:'IBM Plex Mono',monospace; text-align:center; background:rgba(255,255,255,0.05);}

  .navtabs{margin-top:6px;}
  .navtab{
    position:relative; display:flex; align-items:center; gap:10px;
    padding:12px 18px 12px 22px; cursor:pointer; color:#CFE4E0;
    border-left:3px solid transparent; font-size:13.5px; font-weight:500;
    transition:background .15s, color .15s;
  }
  .navtab .idx{font-family:'IBM Plex Mono',monospace; font-size:11px; color:#7FAAA3; width:18px; flex-shrink:0;}
  .navtab:hover{background:rgba(255,255,255,0.05); color:#fff;}
  .navtab.active{background:var(--bg); color:var(--primary-dk); border-left-color:var(--accent); border-radius:8px 0 0 8px; margin-right:-1px;}
  .navtab.active .idx{color:var(--accent);}

  .monthpicker{margin:16px 18px 0 18px; padding-top:14px; border-top:1px solid rgba(255,255,255,0.12);}
  .monthpicker label{font-size:10px; text-transform:uppercase; letter-spacing:.12em; color:#9FC4BE; display:block; margin-bottom:5px;}
  .monthpicker input{width:100%; padding:7px 8px; border-radius:4px; border:1px solid rgba(255,255,255,0.18); background:rgba(255,255,255,0.08); color:#fff; font-family:'IBM Plex Mono',monospace; font-size:12.5px;}
  .monthpicker select{width:100%; padding:7px 8px; border-radius:4px; border:1px solid rgba(255,255,255,0.18); background:#0D3835; color:#fff; font-family:'IBM Plex Sans',sans-serif; font-size:12px;}

  /* ===== MAIN ===== */
  .main{flex:1; padding:28px 36px 60px 36px; max-width:1180px;}
  .pagehead{display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:22px; flex-wrap:wrap; gap:10px;}
  .monthchips{display:flex; align-items:center; gap:7px; flex-wrap:wrap; margin-bottom:14px;}
  .monthchips-label{font-size:11px; color:var(--ink-soft); font-weight:600; margin-right:2px;}
  .chip{border:1px solid var(--border); background:#fff; color:var(--ink-soft); font-size:12px; font-weight:600; padding:5px 12px; border-radius:20px; cursor:pointer; transition:all .15s;}
  .chip:hover{border-color:var(--primary); color:var(--primary);}
  .chip.active{background:var(--primary); border-color:var(--primary); color:#fff;}
  .pagehead h2{margin:0; font-size:26px; font-weight:600;}
  .pagehead .sub{color:var(--ink-soft); font-size:13px; margin-top:2px;}
  .periodbadge{font-family:'IBM Plex Mono',monospace; background:var(--primary-light); color:var(--primary-dk); padding:5px 12px; border-radius:20px; font-size:12.5px; font-weight:600;}

  .grid{display:grid; gap:16px;}
  .grid.cols-2{grid-template-columns:1fr 1fr;}
  .grid.cols-3{grid-template-columns:repeat(3,1fr);}
  .grid.cols-4{grid-template-columns:repeat(4,1fr);}
  .grid.cols-5{grid-template-columns:repeat(5,1fr);}
  @media(max-width:900px){.grid.cols-2,.grid.cols-3,.grid.cols-4,.grid.cols-5{grid-template-columns:1fr;}}

  .card{background:var(--card); border:1px solid var(--border); border-radius:10px; padding:18px 20px; box-shadow:var(--shadow);}
  .card h3{margin:0 0 12px 0; font-size:15px; font-weight:600; display:flex; align-items:center; justify-content:space-between;}
  .card h3 .hint{font-family:'IBM Plex Sans',sans-serif; font-size:11px; font-weight:400; color:var(--ink-soft);}

  .statcard{background:var(--card); border:1px solid var(--border); border-radius:10px; padding:16px 18px; box-shadow:var(--shadow);}
  .statcard .lbl{font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-soft); margin-bottom:6px;}
  .statcard .num{font-family:'Fraunces',serif; font-size:30px; font-weight:600; color:var(--primary-dk); line-height:1;}
  .statcard .foot{font-size:11.5px; color:var(--ink-soft); margin-top:6px;}
  .statcard .foot.ok{color:var(--ok);}
  .statcard .foot.warn{color:var(--danger);}

  table{width:100%; border-collapse:collapse; font-size:13px;}
  th{text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); font-weight:600; padding:6px 8px; border-bottom:1px solid var(--border);}
  td{padding:6px 8px; border-bottom:1px solid #EDEFE7;}
  tr:last-child td{border-bottom:none;}
  td input, td select{width:100%; border:1px solid transparent; background:transparent; padding:4px 5px; border-radius:4px; font-family:'IBM Plex Sans',sans-serif; font-size:13px;}
  td input:focus, td select:focus{border-color:var(--primary); background:#fff; outline:none;}
  td input[type=number]{font-family:'IBM Plex Mono',monospace; text-align:right;}
  .rowbtn{background:none; border:none; color:var(--danger); cursor:pointer; font-size:15px; padding:2px 6px;}
  .rowbtn:hover{opacity:.7;}
  .addrow{margin-top:8px; background:var(--primary-light); color:var(--primary-dk); border:1px dashed var(--primary); padding:6px 12px; border-radius:6px; font-size:12.5px; font-weight:600; cursor:pointer;}
  .addrow:hover{background:#cfe4e0;}

  .pct-bar{height:6px; border-radius:3px; background:#EDEFE7; overflow:hidden; margin-top:3px;}
  .pct-bar > div{height:100%; background:var(--primary); border-radius:3px;}

  label.f{display:block; font-size:11.5px; color:var(--ink-soft); margin-bottom:4px; font-weight:500;}
  input.f, textarea.f{width:100%; padding:8px 10px; border:1px solid var(--border); border-radius:6px; font-family:'IBM Plex Sans',sans-serif; font-size:13.5px; background:#FCFCFA;}
  input.f:focus, textarea.f:focus{outline:none; border-color:var(--primary);}
  textarea.f{resize:vertical; min-height:90px; line-height:1.5;}
  .fieldgrid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px;}

  .btnbar{display:flex; gap:10px; margin:26px 0 6px 0; align-items:center; flex-wrap:wrap;}
  .btn{padding:9px 18px; border-radius:7px; border:1px solid var(--primary); background:var(--primary); color:#fff; font-weight:600; font-size:13px; cursor:pointer;}
  .btn:hover{background:var(--primary-dk);}
  .btn.ghost{background:transparent; color:var(--primary); }
  .btn.ghost:hover{background:var(--primary-light);}
  .btn.accent{background:var(--accent); border-color:var(--accent);}
  .btn.accent:hover{background:#9c5f24;}
  .savedmsg{font-size:12.5px; color:var(--ok); font-weight:600; opacity:0; transition:opacity .3s;}
  .savedmsg.show{opacity:1;}

  .swot-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  @media(max-width:800px){.swot-grid{grid-template-columns:1fr;}}
  .swot-box{border-radius:10px; padding:16px 18px; border:1px solid var(--border);}
  .swot-box.s{background:#F0F7F3; border-color:#BFE0CC;}
  .swot-box.w{background:#FBF0EC; border-color:#EFC7B8;}
  .swot-box.o{background:#EEF3FB; border-color:#C4D6EE;}
  .swot-box.t{background:#FBECEC; border-color:#EFC0C0;}
  .swot-box h4{margin:0 0 8px 0; font-size:13.5px; display:flex; align-items:center; gap:7px;}
  .swot-box .letter{display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px; border-radius:5px; font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:700; color:#fff;}
  .s .letter{background:var(--ok);} .w .letter{background:var(--danger);} .o .letter{background:#2E5B9C;} .t .letter{background:#9C2E2E;}
  .swot-box textarea{width:100%; min-height:120px; border:none; background:transparent; resize:vertical; font-family:'IBM Plex Sans',sans-serif; font-size:13px; line-height:1.6;}
  .swot-box textarea:focus{outline:none;}

  .eff-row{display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid #EDEFE7;}
  .eff-row:last-child{border-bottom:none;}
  .eff-name{font-size:13px; font-weight:600;}
  .eff-desc{font-size:11px; color:var(--ink-soft);}
  .eff-val{font-family:'IBM Plex Mono',monospace; font-size:18px; font-weight:600; text-align:right;}
  .eff-target{font-size:10.5px; color:var(--ink-soft); text-align:right;}
  .pill{display:inline-block; padding:2px 9px; border-radius:20px; font-size:10.5px; font-weight:700; margin-left:6px;}
  .pill.ok{background:var(--ok-light); color:var(--ok);}
  .pill.bad{background:var(--danger-light); color:var(--danger);}

  .empty{padding:30px; text-align:center; color:var(--ink-soft); font-size:13px;}
  .histlist{list-style:none; margin:0; padding:0;}
  .histlist li{display:flex; justify-content:space-between; align-items:center; padding:11px 4px; border-bottom:1px solid #EDEFE7; font-size:13px;}
  .histlist li:last-child{border-bottom:none;}
  .histlist .hact{color:var(--primary); cursor:pointer; font-weight:600; font-size:12px;}
  .histlist .hact:hover{text-decoration:underline;}

  .printhead{display:none;}
  @media print{
    .sidebar, .btnbar, .navtab, .no-print{display:none !important;}
    .main{padding:0; max-width:100%;}
    .app{display:block;}
    body{background:#fff;}
    .card{box-shadow:none; break-inside:avoid;}
    .printhead{display:block; margin-bottom:20px;}
    canvas{ -webkit-print-color-adjust:exact; print-color-adjust:exact; color-adjust:exact; }
  }
  ::-webkit-scrollbar{width:9px;} ::-webkit-scrollbar-thumb{background:#c9cdc0; border-radius:5px;}

  /* ===== LOGIN SCREEN ===== */
  .login-screen{
    position:fixed; inset:0; background:var(--primary-dk); display:flex; align-items:center; justify-content:center; z-index:100;
    background-image: radial-gradient(circle at 20% 20%, rgba(255,255,255,0.05), transparent 40%), radial-gradient(circle at 80% 80%, rgba(255,255,255,0.04), transparent 40%);
  }
  .login-card{width:340px; background:#fff; border-radius:12px; padding:30px 28px; box-shadow:0 20px 50px rgba(0,0,0,0.35);}
  .login-card .tag{font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--primary); font-weight:600; margin-bottom:6px;}
  .login-card h1{font-size:21px; margin:0 0 18px 0; font-weight:600; color:var(--ink);}
  .login-card label{display:block; font-size:11.5px; color:var(--ink-soft); margin-bottom:4px; font-weight:500; margin-top:12px;}
  .login-card input{width:100%; padding:9px 11px; border:1px solid var(--border); border-radius:7px; font-family:'IBM Plex Sans',sans-serif; font-size:13.5px; background:#FCFCFA;}
  .login-card input:focus{outline:none; border-color:var(--primary);}
  .login-card .btn{width:100%; margin-top:20px; padding:10px; font-size:13.5px;}
  .login-error{color:var(--danger); font-size:12px; margin-top:10px; min-height:14px; font-weight:500;}
  .login-hint{margin-top:16px; padding-top:14px; border-top:1px solid var(--border); font-size:11px; color:var(--ink-soft); line-height:1.6;}

  .userbadge{display:flex; align-items:center; justify-content:space-between; padding:10px 18px; margin-top:2px; font-size:12px;}
  .userbadge .role{background:rgba(255,255,255,0.12); padding:2px 9px; border-radius:20px; font-size:10px; font-weight:700; letter-spacing:.04em;}
  .userbadge .logout{color:#CFE4E0; cursor:pointer; font-size:11.5px; text-decoration:underline;}
  .userbadge .logout:hover{color:#fff;}

  /* ===== LOGOS ===== */
  .login-logos{display:flex; align-items:center; justify-content:center; gap:16px; margin-bottom:14px;}
  .login-logos img{height:56px; width:auto; object-fit:contain;}
  .brand-logos{display:flex; align-items:center; gap:8px; margin-bottom:10px;}
  .brand-logos img{height:34px; width:auto; object-fit:contain;}
  .print-logos{display:flex; align-items:center; gap:14px; margin-bottom:10px;}
  .print-logos img{height:52px; width:auto; object-fit:contain;}
  .printhead-row{display:flex; align-items:center; gap:14px; margin-bottom:16px; border-bottom:2px solid var(--primary); padding-bottom:14px;}
  .printhead-row .txt h2{margin:0; font-size:19px;}
  .printhead-row .txt .sub{font-size:12px; margin-top:2px;}

  /* ===== WATERMARK ===== */
  .page-watermark{
    position:fixed; top:50%; left:calc(230px + (100% - 230px)/2); transform:translate(-50%,-50%);
    width:380px; max-width:60vw; height:auto;
    opacity:0.07; filter:grayscale(100%);
    pointer-events:none; z-index:5;
  }
  @media print{
    .page-watermark{
      opacity:0.10; width:340px; max-width:45vw;
      left:50%;
      -webkit-print-color-adjust:exact; print-color-adjust:exact; color-adjust:exact;
      position:fixed; top:50%; transform:translate(-50%,-50%);
    }
  }
  .report-footer{margin-top:22px; padding-top:14px; border-top:1px solid var(--border); font-size:11.5px; color:var(--ink-soft); display:flex; justify-content:space-between; align-items:flex-end; gap:16px; flex-wrap:wrap;}
  .report-footer .printed-at{text-align:left; font-size:11px;}
  .ttd-block{text-align:right; font-style:italic;}
  .ttd-block .ttd-name{font-weight:600; font-style:normal; margin-top:2px;}
  .ttd-barcode{display:block; margin-left:auto; margin-top:6px;}
  .app-footer{margin-top:34px; padding-top:14px; border-top:1px solid var(--border); text-align:center; font-size:11.5px; color:var(--ink-soft);}
  .app-footer b{color:var(--primary-dk);}
  @media print{ .app-footer{margin-top:20px;} }

  body.viewer-mode #main input, body.viewer-mode #main textarea, body.viewer-mode #main select{
    pointer-events:none; background:#F1F2EC !important; color:#6B7570;
  }
  body.viewer-mode .addrow, body.viewer-mode .rowbtn, body.viewer-mode #btnSave, body.viewer-mode #btnDraftSwot, body.viewer-mode .hact-del, body.viewer-mode #btnAddMonth{
    display:none !important;
  }
</style>
</head>
<body>

<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <div class="login-logos">
      <img src="" id="loginLogoRS" alt="Logo RSU Nurhayati Cikajang">
      <img src="" id="loginLogoRM" alt="Logo Instalasi Rekam Medis">
    </div>
    <div class="tag" style="text-align:center;">Rekam Medis · Bulanan</div>
    <h1 style="text-align:center;">Masuk ke Sistem Pelaporan</h1>
    <label>Username</label>
    <input id="loginUser" autocomplete="username" placeholder="Masukkan username">
    <label>Password</label>
    <input id="loginPass" type="password" autocomplete="current-password" placeholder="Masukkan password">
    <div class="login-error" id="loginError"></div>
    <button class="btn" id="btnLogin">Masuk</button>
  </div>
</div>

<div class="app" id="appRoot" style="display:none;">
  <img id="pageWatermark" class="page-watermark" alt="">


  <div class="sidebar no-print">
    <div class="brand">
      <div class="brand-logos">
        <img src="" id="brandLogoRS" alt="Logo RSU Nurhayati Cikajang">
        <img src="" id="brandLogoRM" alt="Logo Instalasi Rekam Medis">
      </div>
      <div class="tag">Rekam Medis · Bulanan</div>
      <h1>Sistem Pelaporan RM</h1>
      <input id="namaRS" placeholder="Nama Rumah Sakit / Klinik">
      <textarea id="alamatRS" placeholder="Alamat Rumah Sakit" rows="2"></textarea>
    </div>
    <div class="userbadge">
      <span>👤 <span id="loggedUser">-</span> <span class="role" id="loggedRole">-</span></span>
      <span class="logout" id="btnLogout">Keluar</span>
    </div>
    <div class="accesstime" id="accessTimeDisplay"></div>
    <div class="liveclock" id="liveClock"></div>
    <div class="navtabs" id="navtabs"></div>
    <div class="monthpicker">
      <label>Periode Laporan</label>
      <input type="month" id="monthInput">
    </div>
    <div class="monthpicker" style="border-top:none; padding-top:10px;">
      <label>Pilih Cepat (Bulan Berisi Data)</label>
      <select id="monthQuickPick"><option value="">— memuat —</option></select>
    </div>
    <div class="monthpicker" style="border-top:none; padding-top:10px;">
      <div id="seedStatus" style="font-size:10px; color:#9FC4BE; text-align:center; line-height:1.5;"></div>
    </div>
  </div>

  <div class="main" id="main"></div>
</div>

<script>
/* ================= LABEL ANGKA PADA GRAFIK (chartjs-plugin-datalabels) ================= */
if(typeof Chart !== 'undefined' && typeof ChartDataLabels !== 'undefined'){
  Chart.register(ChartDataLabels);
  // Mati secara default; setiap grafik mengaktifkannya sendiri via options.plugins.datalabels
  // supaya garis-garis bantu (mis. Grafik Barber-Johnson) tidak ikut diberi label.
  Chart.defaults.set('plugins.datalabels', { display:false });
}
function dlNum(v){ return Number(v||0).toLocaleString('id-ID', {maximumFractionDigits:2}); }
/* ================= STATE & STORAGE ================= */
const TABS = [
  {id:'dashboard', label:'Ringkasan'},
  {id:'kunjungan', label:'Kunjungan & Asuransi'},
  {id:'poli', label:'Poli Spesialis'},
  {id:'asuransiPoli', label:'Asuransi per Poli'},
  {id:'diagnosa', label:'10 Besar Diagnosa'},
  {id:'faskes', label:'Faskes Rujukan Rawat Jalan'},
  {id:'efisiensi', label:'Efisiensi RS'},
  {id:'perbandingan', label:'Perbandingan Bulanan'},
  {id:'swot', label:'Analisa SWOT'},
  {id:'laporan', label:'Laporan Cetak'},
  {id:'riwayat', label:'Riwayat Bulan'},
];
let activeTab = 'dashboard';
let currentMonth = '2026-09'; // bulan terakhir yang datanya sudah tersedia (lihat SEED_DATA)
let namaRS = 'Rumah Sakit Nurhayati Cikajang';
let alamatRS = 'Jalan Cikajang - Pameungpeuk, RT.05/RW.01, Desa Girijaya, Kecamatan Cikajang, Kabupaten Garut, Jawa Barat 44171';
let loginTimestamp = null;
function formatDateTime(d){
  const pad = n=> String(n).padStart(2,'0');
  const hariNames = ['Minggu','Senin','Selasa','Rabu','Kamis',"Jumat",'Sabtu'];
  const bulanNames = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  return `${hariNames[d.getDay()]}, ${d.getDate()} ${bulanNames[d.getMonth()]} ${d.getFullYear()} pukul ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())} WIB`;
}
let charts = {};
let effCharts = {};
let userRole = null; // 'admin' | 'viewer'
let userName = '';

const CREDENTIALS = {
  'fauzy':       {password:'123',      role:'admin',  label:'Fauzy'},
  'rekam medis': {password:'cikajang', role:'viewer', label:'Rekam Medis'},

const LS_PREFIX = 'rm_bulanan__';

function hasNativeStorage(){
  try{ return typeof window.storage !== 'undefined' && window.storage && typeof window.storage.get === 'function'; }

}

  if(hasNativeStorage()){
    try{ return await window.storage.get(key, false); }catch(e){ /* lanjut ke fallback */ }
  }
  try{
    const raw = localStorage.getItem(LS_PREFIX+key);
    if(raw!==null) return {key, value:raw};
  }catch(e){ /* localStorage diblokir, lanjut ke memori */ }
  return (key in memFallback) ? {key, value:memFallback[key]} : null;
}
async function storeSet(key, value){
  if(hasNativeStorage()){
    try{ return await window.storage.set(key, value, false); }catch(e){ /* lanjut ke fallback */ }
  }
  try{ localStorage.setItem(LS_PREFIX+key, value); return {key, value}; }
  catch(e){ memFallback[key] = value; return {key, value}; }
}
async function storeDelete(key){
  if(hasNativeStorage()){

  }
  try{ localStorage.removeItem(LS_PREFIX+key); }catch(e){}
  delete memFallback[key];
  return {key, deleted:true};
}

async function loadMonth(m){
  try{
    const res = await storeGet('bulan:'+m);
    if(res && res.value){
      // Object.assign dengan defaultData() sebagai dasar: field BARU yang belum ada
      // pada data lama (tersimpan sebelum field itu ditambahkan ke aplikasi) otomatis
      // terisi nilai default, bukan undefined — jadi menu baru tidak pernah kosong/error
      // hanya karena datanya berasal dari versi aplikasi sebelumnya.
      data = Object.assign(defaultData(), JSON.parse(res.value));
    } else {
      // Belum ada data tersimpan untuk bulan ini di penyimpanan.
      let deleted = false;
      try{
        const dflag = await storeGet('bulan-deleted:'+m);
        deleted = !!(dflag && dflag.value === '1');
      }catch(e){ deleted = false; }
      if(!deleted && SEED_DATA[m]){
        // Isi otomatis dari data awal (SEED_DATA), lalu simpan permanen ke penyimpanan
        // sehingga sejak saat ini berperilaku persis seperti data yang diinput manual.
        data = Object.assign(defaultData(), JSON.parse(JSON.stringify(SEED_DATA[m])));
        await persistSeed(m, data);
      } else {
        data = defaultData();
      }
    }
  }catch(e){
    data = defaultData();
  }
  render();
  refreshMonthQuickPick();
}
async function persistSeed(m, d){
  try{
    await storeSet('bulan:'+m, JSON.stringify(d));
    let idx = [];
    try{
      const r = await storeGet('bulan-index');
      idx = r && r.value ? JSON.parse(r.value) : [];
    }catch(e){ idx = []; }
    if(!idx.includes(m)){ idx.push(m); idx.sort(); }
    await storeSet('bulan-index', JSON.stringify(idx));
  }catch(e){ console.error('Gagal menyimpan data awal', e); }
}

async function saveMonth(silent){

/* ================= HELPERS ================= */
function sum(arr, key){ return arr.reduce((a,b)=> a + (Number(b[key])||0), 0); }
function pct(v, total){ return total>0 ? (v/total*100) : 0; }
function fmt(n){ return Number(n||0).toLocaleString('id-ID'); }
function fmt1(n){ return Number(n||0).toLocaleString('id-ID', {maximumFractionDigits:1, minimumFractionDigits:1}); }
function daysInMonth(m){ const [y,mo] = m.split('-').map(Number); return new Date(y, mo, 0).getDate(); }
function monthLabel(m){
  const [y,mo] = m.split('-').map(Number);
  const names=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  return names[mo-1]+' '+y;
}
function topN(arr, n){
  return [...arr].filter(x=>Number(x.jumlah)>0).sort((a,b)=>b.jumlah-a.jumlah).slice(0,n);
}

/* ================= EFFICIENCY CALC ================= */
function calcEfisiensi(d, m){
  d = d || data; m = m || currentMonth;
  const e = d.efisiensi;
  const TT = Number(e.tempatTidur)||0;
  const hp = Number(e.hariPerawatan)||0;
  // Lama Dirawat (LD) dipakai khusus untuk ALOS/LOS sesuai metodologi resmi;
  // jika belum diisi (data lama), gunakan Hari Perawatan sebagai fallback.
  const ld = (e.lamaDirawat!==undefined && e.lamaDirawat!=='' && e.lamaDirawat!==null) ? (Number(e.lamaDirawat)||0) : hp;
  const keluar = (Number(e.keluarHidup)||0) + (Number(e.keluarMati)||0);
  const hd = daysInMonth(m);
  const totalHariTT = TT * hd;
  const BOR = totalHariTT>0 ? (hp/totalHariTT*100) : 0;
  const LOS = keluar>0 ? (ld/keluar) : 0;
  const TOI = keluar>0 ? ((totalHariTT-hp)/keluar) : 0;
  const BTO = TT>0 ? (keluar/TT) : 0;
  const BTOtahun = BTO*12;
  const GDR = keluar>0 ? ((Number(e.keluarMati)||0)/keluar*1000) : 0;
  const NDR = keluar>0 ? ((Number(e.mati48)||0)/keluar*1000) : 0;
  return {BOR,LOS,TOI,BTO,BTOtahun,GDR,NDR,hd,totalHariTT,keluar};
}
function inRange(v,lo,hi){ return v>=lo && v<=hi; }

  const semua = [
    ...(data.asuransi||[]),

    ...(data.asuransiIgd||[]),
  ];
  const map = {};

    if(!(nama in map)){ map[nama]=0; order.push(nama); }

  return order.map(nama=>({nama, jumlah:map[nama]}));
}

/* ================= POLI SPESIALIS ================= */
function capaianStatus(realisasi, target){
  if(!target || Number(target)<=0) return {pct:null, label:'Target belum diisi', cls:''};
  const p = pct(realisasi, target);
  if(p>=100) return {pct:p, label:'Tercapai', cls:'ok'};
  if(p>=80) return {pct:p, label:'Mendekati Target', cls:''};
  return {pct:p, label:'Belum Tercapai', cls:'bad'};
}
function analyzePoli(){
  const rows = data.poli.filter(p=>p.nama);
  const withTarget = rows.filter(p=>Number(p.target)>0);
  if(rows.length===0) return ['Belum ada data poli spesialis yang diisi.'];
  const out = [];
  if(withTarget.length===0){
    out.push('Target kunjungan belum diisi untuk poli manapun — isi kolom Target agar analisa capaian dapat dihitung.');
  } else {
    const totalReal = sum(withTarget,'jumlah'), totalTarget = sum(withTarget,'target');
    const capaianTotal = pct(totalReal, totalTarget);
    const tercapai = withTarget.filter(p=>pct(p.jumlah,p.target)>=100).sort((a,b)=>pct(b.jumlah,b.target)-pct(a.jumlah,a.target));
    const belum = withTarget.filter(p=>pct(p.jumlah,p.target)<100).sort((a,b)=>pct(a.jumlah,a.target)-pct(b.jumlah,b.target));
    out.push(`Capaian kunjungan keseluruhan poli spesialis (yang memiliki target) adalah ${fmt1(capaianTotal)}% dari total target ${fmt(totalTarget)} kunjungan (realisasi ${fmt(totalReal)}).`);
    if(tercapai.length){
      const top = tercapai[0];
      out.push(`${tercapai.length} poli telah mencapai atau melampaui target. Capaian tertinggi: ${top.nama} sebesar ${fmt1(pct(top.jumlah,top.target))}% (${fmt(top.jumlah)} dari target ${fmt(top.target)}).`);
    }
    if(belum.length){
      const worst = belum[0];
      out.push(`${belum.length} poli belum mencapai target. Capaian terendah: ${worst.nama} sebesar ${fmt1(pct(worst.jumlah,worst.target))}% (kekurangan ${fmt(worst.target-worst.jumlah)} kunjungan dari target).`);
      const kritis = belum.filter(p=>pct(p.jumlah,p.target)<80);
      if(kritis.length) out.push(`Poli yang capaiannya di bawah 80% dan perlu perhatian khusus: ${kritis.map(p=>p.nama).join(', ')}. Perlu ditelusuri penyebabnya — jadwal dokter, promosi layanan, atau kapasitas ruang periksa.`);
    } else {
      out.push('Seluruh poli dengan target telah mencapai target kunjungan bulan ini — pertahankan strategi layanan dan jadwal praktik yang berjalan.');
    }
  }
  const rowsWithBaru = rows.filter(p=>Number(p.jumlah)>0);
  if(rowsWithBaru.length){
    const totalReal2 = sum(rowsWithBaru,'jumlah');
    const totalBaru = sum(rowsWithBaru,'pasienBaru');
    const persenBaru = pct(totalBaru, totalReal2);
    out.push(`Proporsi pasien baru terhadap seluruh kunjungan poli spesialis adalah ${fmt1(persenBaru)}% (${fmt(totalBaru)} pasien baru dari ${fmt(totalReal2)} total kunjungan); sisanya ${fmt1(100-persenBaru)}% merupakan kunjungan pasien lama / kontrol.`);
    const tertinggiBaru = [...rowsWithBaru].sort((a,b)=>pct(b.pasienBaru,b.jumlah)-pct(a.pasienBaru,a.jumlah))[0];
    if(tertinggiBaru && Number(tertinggiBaru.pasienBaru)>0){
      out.push(`Poli dengan proporsi pasien baru tertinggi: ${tertinggiBaru.nama} (${fmt1(pct(tertinggiBaru.pasienBaru,tertinggiBaru.jumlah))}% dari kunjungan poli tersebut) — menunjukkan daya tarik layanan baru atau efektivitas rujukan masuk.`);
    }
    if(persenBaru<20) out.push('Proporsi pasien baru tergolong rendah (<20%), didominasi kunjungan kontrol/lama — perlu strategi promosi atau perluasan jejaring rujukan untuk menjaring pasien baru.');
  }
  return out;
}
function fmtRp(n){
  return 'Rp ' + Math.round(n||0).toLocaleString('id-ID');
}
function calcSimulatorPoli(){
  const sim = data.simulator || {tarif:0, targetPercent:80};
  const tarif = Number(sim.tarif)||0;
  const targetPct = Number(sim.targetPercent)||0;
  let kekurangan = 0;
  data.poli.forEach(p=>{
    const target = Number(p.target)||0;
    const jumlah = Number(p.jumlah)||0;
    if(target<=0) return;
    const targetAtPct = target * (targetPct/100);
    if(jumlah < targetAtPct) kekurangan += (targetAtPct - jumlah);
  });
  kekurangan = Math.round(kekurangan);
  const pendapatanBulan = kekurangan * tarif;
  const pendapatanTahun = pendapatanBulan * 12;
  return {kekurangan, pendapatanBulan, pendapatanTahun};
}

  const r = calcSimulatorPoli();

  const elT = document.getElementById('simPendapatanTahun'); if(elT) elT.textContent = fmtRp(r.pendapatanTahun);
}

/* ================= AGREGASI (Semester / Tahunan) & GRAFIK BJ KLASIK ================= */
async function computeAggregate(monthList){
  let sumHP=0, sumKeluar=0, sumTTHari=0, sumTT=0, sumMati=0, sumMati48=0, n=0;
  for(const m of monthList){
    const d = await fetchMonthData(m);
    if(!d) continue;
    const e = d.efisiensi;
    const TT = Number(e.tempatTidur)||0;
    const hp = Number(e.hariPerawatan)||0;
    const kh = Number(e.keluarHidup)||0;
    const km = Number(e.keluarMati)||0;
    const m48 = Number(e.mati48)||0;
    const hd = daysInMonth(m);
    sumHP += hp;
    sumKeluar += (kh+km);
    sumTTHari += TT*hd;
    sumTT += TT;
    sumMati += km;
    sumMati48 += m48;
    n++;
  }
  const avgTT = n>0 ? sumTT/n : 0;
  const BOR = sumTTHari>0 ? (sumHP/sumTTHari*100) : 0;
  const ALOS = sumKeluar>0 ? (sumHP/sumKeluar) : 0; // metode BJ2
  const TOI = sumKeluar>0 ? ((sumTTHari-sumHP)/sumKeluar) : 0;
  const BTOtahun = (avgTT>0 && n>0) ? (sumKeluar/avgTT)*(12/n) : 0;
  const GDR = sumKeluar>0 ? (sumMati/sumKeluar*1000) : 0;
  const NDR = sumKeluar>0 ? (sumMati48/sumKeluar*1000) : 0;
  return {BOR,ALOS,TOI,BTOtahun,GDR,NDR,n,sumKeluar};
}

}

function prevMonthStr(m){
  const [y,mo] = m.split('-').map(Number);
  let py=y, pmo=mo-1;
  if(pmo<1){ pmo=12; py=y-1; }
  return py+'-'+String(pmo).padStart(2,'0');
}
function deltaInfo(valA, valB, invert){
  const a = Number(valA)||0, b = Number(valB)||0;
  const diff = a - b;
  const pctChange = b!==0 ? (diff/b*100) : (a>0 ? 100 : 0);
  const neutral = diff===0;
  const naik = diff>0;
  const good = neutral ? null : (invert ? !naik : naik);
  const arrow = neutral ? '→' : (naik ? '▲' : '▼');
  const cls = neutral ? '' : (good ? 'ok' : 'bad');
  return {diff, pctChange, arrow, cls, naik, neutral};
}
function cmpRow(label, a, b, invert){

  return `<tr>

    <td style="text-align:right"><span class="pill ${d.cls}">${d.arrow} ${fmt1(Math.abs(d.pctChange))}%</span></td>
  </tr>`;
}

function mergeByName(arrA, arrB, key){
  const names = new Set([...arrA.map(x=>x[key]), ...arrB.map(x=>x[key])]);
  return [...names].filter(n=>n).map(n=>({
    nama:n,
    a: arrA.find(x=>x[key]===n) || null,
    b: arrB.find(x=>x[key]===n) || null,
  }));
}
function icd3(kode){
  return (kode||'').trim().slice(0,3).toUpperCase();
}
function mergeByICD3(arrA, arrB){
  // Menyamakan diagnosa antar bulan berdasarkan KELOMPOK kode ICD-10 (3 karakter
  // awal), bukan nama teksnya — karena sumber data bisa menuliskan diagnosa yang
  // sama dengan kode/nama sedikit berbeda antar bulan (mis. "I50.0 Congestive
  // heart failure" vs "I50 Heart failure" — keduanya kelompok ICD I50 yang sama).
  const keys = new Set([...arrA.map(x=>icd3(x.kode)), ...arrB.map(x=>icd3(x.kode))]);
  return [...keys].filter(k=>k).map(k=>{
    const a = arrA.find(x=>icd3(x.kode)===k) || null;
    const b = arrB.find(x=>icd3(x.kode)===k) || null;
    const nama = (a && a.nama) || (b && b.nama) || k;
    const namaBeda = a && b && a.nama && b.nama && a.nama.trim().toLowerCase()!==b.nama.trim().toLowerCase();
    return { nama, kode:k, a, b, namaBeda };
  });
}

function effFrom(d, monthStr){
  const TT = Number(d.efisiensi.tempatTidur)||0;
  const hp = Number(d.efisiensi.hariPerawatan)||0;
  const ld = (d.efisiensi.lamaDirawat!==undefined && d.efisiensi.lamaDirawat!=='' && d.efisiensi.lamaDirawat!==null) ? (Number(d.efisiensi.lamaDirawat)||0) : hp;
  const keluar = (Number(d.efisiensi.keluarHidup)||0) + (Number(d.efisiensi.keluarMati)||0);
  const hd = daysInMonth(monthStr);
  const totalHariTT = TT*hd;
  const BOR = totalHariTT>0 ? (hp/totalHariTT*100) : 0;
  const LOS = keluar>0 ? (ld/keluar) : 0;
  const TOI = keluar>0 ? ((totalHariTT-hp)/keluar) : 0;
  const BTOtahun = (TT>0 ? (keluar/TT) : 0)*12;
  const GDR = keluar>0 ? ((Number(d.efisiensi.keluarMati)||0)/keluar*1000) : 0;
  const NDR = keluar>0 ? ((Number(d.efisiensi.mati48)||0)/keluar*1000) : 0;
  return {BOR,LOS,TOI,BTOtahun,GDR,NDR};
}

  <div class="card" style="margin-bottom:16px;">
    <h3>4. Perbandingan Capaian Target per Poli Spesialis <span class="hint">persentase realisasi terhadap target, ${labB} vs ${labA}</span></h3>
    <table><thead><tr><th>Poli</th><th style="text-align:right">${labB}</th><th style="text-align:right">${labA}</th><th style="text-align:right">Selisih Capaian</th></tr></thead><tbody>
      ${poli.map(x=>{
        const targetA = x.a ? Number(x.a.target)||0 : 0;
        const targetB = x.b ? Number(x.b.target)||0 : 0;
        const capA = (x.a && targetA>0) ? pct(x.a.jumlah, targetA) : null;
        const capB = (x.b && targetB>0) ? pct(x.b.jumlah, targetB) : null;
        if(capA===null && capB===null){
          return `<tr><td>${x.nama}</td><td colspan="3" style="text-align:center;color:var(--ink-soft);font-size:12px;">Target belum diisi di kedua bulan</td></tr>`;
        }
        const a=capA??0, b=capB??0, diff=a-b;
        const cls = diff>=0?'ok':'bad';
        const arrow = diff>0?'▲':diff<0?'▼':'▬';
        return `<tr>
          <td>${x.nama}</td>
          <td class="mono" style="text-align:right">${capB===null?'-':fmt1(capB)+'%'}</td>
          <td class="mono" style="text-align:right">${capA===null?'-':fmt1(capA)+'%'}</td>
          <td style="text-align:right"><span class="pill ${cls}">${arrow} ${fmt1(Math.abs(diff))}%</span></td>
        </tr>`;
      }).join('')}
    </tbody></table>
  </div>

  <div class="card" style="margin-bottom:16px;">
    <h3>5. Fasilitas Kesehatan Perujuk Rawat Jalan</h3>
    <table>${cmpTableHead(labA,labB)}<tbody>
      ${cmpRow('Total Rujukan', sum(dA.faskes,'jumlah'), sum(dB.faskes,'jumlah'))}
      ${faskes.map(x=>cmpRow(x.nama, x.a?x.a.jumlah:0, x.b?x.b.jumlah:0)).join('')}
    </tbody></table>
  </div>

  <div class="grid cols-2" style="margin-bottom:16px;">
    <div class="card">
      <h3>6. Diagnosa Rawat Inap <span class="hint">10 besar — dicocokkan per kelompok kode ICD-10</span></h3>
      ${baruRI.length ? `<div style="font-size:12px; margin-bottom:8px;"><b>Diagnosa baru masuk 10 besar:</b> ${baruRI.map(d=>d.nama).join(', ')}</div>` : ''}
      ${hilangRI.length ? `<div style="font-size:12px; margin-bottom:8px; color:var(--ink-soft);"><b>Keluar dari 10 besar:</b> ${hilangRI.map(d=>d.nama).join(', ')}</div>` : ''}
      <table>${cmpTableHead(labA,labB)}<tbody>
        ${mergeByICD3(driA,driB).map(x=>cmpRow(x.kode+' — '+x.nama+(x.namaBeda?' *':''), x.a?x.a.jumlah:0, x.b?x.b.jumlah:0)).join('')}
      </tbody></table>
      ${mergeByICD3(driA,driB).some(x=>x.namaBeda) ? `<div style="font-size:11px;color:var(--ink-soft);margin-top:6px;">* penulisan nama diagnosa sedikit berbeda antar bulan, tapi kelompok kode ICD-10-nya sama sehingga tetap dibandingkan.</div>` : ''}
    </div>
    <div class="card">
      <h3>7. Diagnosa Rawat Jalan <span class="hint">10 besar — dicocokkan per kelompok kode ICD-10</span></h3>
      ${baruRJ.length ? `<div style="font-size:12px; margin-bottom:8px;"><b>Diagnosa baru masuk 10 besar:</b> ${baruRJ.map(d=>d.nama).join(', ')}</div>` : ''}
      ${hilangRJ.length ? `<div style="font-size:12px; margin-bottom:8px; color:var(--ink-soft);"><b>Keluar dari 10 besar:</b> ${hilangRJ.map(d=>d.nama).join(', ')}</div>` : ''}
      <table>${cmpTableHead(labA,labB)}<tbody>
        ${mergeByICD3(drjA,drjB).map(x=>cmpRow(x.kode+' — '+x.nama+(x.namaBeda?' *':''), x.a?x.a.jumlah:0, x.b?x.b.jumlah:0)).join('')}
      </tbody></table>
      ${mergeByICD3(drjA,drjB).some(x=>x.namaBeda) ? `<div style="font-size:11px;color:var(--ink-soft);margin-top:6px;">* penulisan nama diagnosa sedikit berbeda antar bulan, tapi kelompok kode ICD-10-nya sama sehingga tetap dibandingkan.</div>` : ''}
    </div>
  </div>

  <div class="card" style="margin-bottom:16px;">
    <h3>8. Statistik Efisiensi Rumah Sakit</h3>
    <table>${cmpTableHead(labA,labB)}<tbody>
      ${cmpRowFloat('BOR (Okupansi TT)', eA.BOR, eB.BOR, '%')}
      ${cmpRowFloat('LOS (Lama Rawat)', eA.LOS, eB.LOS, ' hari')}
      ${cmpRowFloat('TOI (Tenggang Perputaran)', eA.TOI, eB.TOI, ' hari')}
      ${cmpRowFloat('BTO (Perputaran TT/tahun)', eA.BTOtahun, eB.BTOtahun, 'x')}
      ${cmpRowFloat('GDR (Kematian Umum)', eA.GDR, eB.GDR, '‰', true)}
      ${cmpRowFloat('NDR (Kematian &gt;48 jam)', eA.NDR, eB.NDR, '‰', true)}
    </tbody></table>
  </div>

  <div class="card">
    <h3>9. Analisa Otomatis Perbandingan <span class="hint">ringkasan progres ${labA} terhadap ${labB}</span></h3>
    <ul style="margin:0; padding-left:18px; line-height:1.9; font-size:13px;">
      ${narasi.map(n=>`<li>${n}</li>`).join('')}
    </ul>
  </div>
  ${reportFooterHTML()}
  <div class="btnbar no-print"><button class="btn" onclick="window.print()">🖨 Cetak / Simpan sebagai PDF</button></div>
  `;
}
function buildNarasi(ctx){
  const {labA,labB,totalA,totalB,dA,dB,asr,poli,faskes,eA,eB,baruRI,hilangRI,baruRJ,hilangRJ} = ctx;
  const out = [];
  const dTotal = deltaInfo(totalA,totalB);
  out.push(`Total kunjungan ${labA} sebesar ${fmt(totalA)}, ${dTotal.neutral?'sama dengan':(dTotal.naik?'naik':'turun')} ${fmt1(Math.abs(dTotal.pctChange))}% dibandingkan ${labB} (${fmt(totalB)}).`);
  const dRI = deltaInfo(dA.rawatInap,dB.rawatInap), dRJ = deltaInfo(dA.rawatJalan,dB.rawatJalan);
  out.push(`Rawat inap ${dRI.neutral?'stabil':(dRI.naik?'meningkat':'menurun')} ${fmt1(Math.abs(dRI.pctChange))}%, sedangkan rawat jalan ${dRJ.neutral?'stabil':(dRJ.naik?'meningkat':'menurun')} ${fmt1(Math.abs(dRJ.pctChange))}% dibandingkan bulan pembanding.`);

  const asrValid = asr.filter(x=>x.a||x.b);
  if(asrValid.length){
    const sorted = [...asrValid].map(x=>({nama:x.nama, d:deltaInfo(x.a?x.a.jumlah:0, x.b?x.b.jumlah:0)})).sort((p,q)=>q.d.pctChange-p.d.pctChange);
    const top = sorted[0], bottom = sorted[sorted.length-1];
    if(top && top.d.naik) out.push(`Penjamin dengan kenaikan kunjungan tertinggi: ${top.nama} (+${fmt1(top.d.pctChange)}%).`);
    if(bottom && !bottom.d.naik && !bottom.d.neutral) out.push(`Penjamin dengan penurunan kunjungan terbesar: ${bottom.nama} (${fmt1(bottom.d.pctChange)}%).`);
  }

  const poliValid = poli.filter(x=>x.a||x.b);
  if(poliValid.length){
    const sortedP = [...poliValid].map(x=>({nama:x.nama, d:deltaInfo(x.a?x.a.jumlah:0, x.b?x.b.jumlah:0)})).sort((p,q)=>q.d.pctChange-p.d.pctChange);
    const topP = sortedP[0], bottomP = sortedP[sortedP.length-1];
    if(topP && topP.d.naik) out.push(`Poli spesialis dengan pertumbuhan kunjungan tertinggi: ${topP.nama} (+${fmt1(topP.d.pctChange)}%).`);
    if(bottomP && !bottomP.d.naik && !bottomP.d.neutral) out.push(`Poli spesialis dengan penurunan kunjungan terbesar: ${bottomP.nama} (${fmt1(bottomP.d.pctChange)}%) — perlu ditelusuri penyebabnya.`);
  }

  const dFaskes = deltaInfo(sum(dA.faskes,'jumlah'), sum(dB.faskes,'jumlah'));
  if(!dFaskes.neutral) out.push(`Jumlah rujukan dari fasilitas kesehatan perujuk ${dFaskes.naik?'meningkat':'menurun'} ${fmt1(Math.abs(dFaskes.pctChange))}% dibandingkan bulan pembanding.`);

  const dBOR = deltaInfo(eA.BOR, eB.BOR);
  out.push(`BOR bergerak dari ${fmt1(eB.BOR)}% (${labB}) menjadi ${fmt1(eA.BOR)}% (${labA})${dBOR.neutral?'':(dBOR.naik?', menunjukkan peningkatan okupansi tempat tidur':', menunjukkan penurunan okupansi tempat tidur')}.`);
  const dLOS = deltaInfo(eA.LOS, eB.LOS);
  if(!dLOS.neutral) out.push(`Rata-rata lama rawat (LOS) ${dLOS.naik?'memanjang':'memendek'} dari ${fmt1(eB.LOS)} menjadi ${fmt1(eA.LOS)} hari.`);
  const dGDR = deltaInfo(eA.GDR, eB.GDR, true);
  const dNDR = deltaInfo(eA.NDR, eB.NDR, true);
  if(!dGDR.neutral || !dNDR.neutral){
    out.push(`Angka kematian GDR ${dGDR.naik?'naik':'turun'} (${fmt1(eB.GDR)}‰ → ${fmt1(eA.GDR)}‰) dan NDR ${dNDR.naik?'naik':'turun'} (${fmt1(eB.NDR)}‰ → ${fmt1(eA.NDR)}‰)${(dGDR.naik||dNDR.naik)?' — perlu perhatian pada mutu keselamatan pasien.':', menunjukkan mutu keselamatan pasien membaik.'}`);
  }
  if(baruRI.length) out.push(`Diagnosa rawat inap baru yang masuk 10 besar di ${labA}: ${baruRI.map(d=>d.nama).join(', ')}.`);
  if(baruRJ.length) out.push(`Diagnosa rawat jalan baru yang masuk 10 besar di ${labA}: ${baruRJ.map(d=>d.nama).join(', ')}.`);
  if(hilangRI.length===0 && hilangRJ.length===0 && baruRI.length===0 && baruRJ.length===0){
    out.push('Pola 10 besar diagnosa relatif stabil, tidak ada perubahan komposisi yang mencolok antara dua periode.');
  }
  return out;
}

function autoFillProfil(){
  if(!data.profil) data.profil = {lokasi:'', layananUnggulan:'', fasilitas:'', kerjasama:''};
  // Lokasi: diambil dari alamat rumah sakit yang sudah diisi di sidebar
  data.profil.lokasi = alamatRS
    ? alamatRS + ' — lokasi strategis di jalur utama Cikajang–Pameungpeuk, mudah dijangkau dari beberapa kecamatan sekitar.'
    : 'Alamat rumah sakit belum diisi (lengkapi di sidebar).';
  // Layanan: diambil dari daftar poli spesialis yang aktif (jumlah kunjungan atau target > 0, atau minimal nama terisi)
  const daftarPoli = data.poli.filter(p=>p.nama && p.nama.trim()!=='').map(p=>p.nama);
  data.profil.layananUnggulan = daftarPoli.length
    ? 'Tersedia layanan poli spesialis: '+daftarPoli.join(', ')+'.'
    : 'Belum ada data poli spesialis (lengkapi di menu Poli Spesialis).';
  // Fasilitas: rumah sakit dengan layanan penunjang standar 24 jam
  data.profil.fasilitas = 'Instalasi Gawat Darurat (IGD) 24 jam, Laboratorium 24 jam, Radiologi (RO), serta fasilitas penunjang medis lainnya.';
  // Kerja sama: diambil dari daftar jenis penjamin/asuransi yang tercatat
  const daftarAsr = data.asuransi.filter(a=>a.nama && a.nama.trim()!=='').map(a=>a.nama);
  data.profil.kerjasama = daftarAsr.length
    ? 'Bekerja sama dengan penjamin: '+daftarAsr.join(', ')+'.'
    : 'Belum ada data penjamin/asuransi (lengkapi di menu Kunjungan & Asuransi).';
}
function generateSwotDraft(){
  const c = calcEfisiensi();
  const totalKunjungan = data.rawatInap + data.rawatJalan;
  const topAsr = [...data.asuransi].sort((a,b)=>b.jumlah-a.jumlah)[0];
  const kekuatan=[], kelemahan=[], peluang=[], ancaman=[];
  const prof = data.profil || {};
  if(prof.lokasi) kekuatan.push('Lokasi & aksesibilitas: '+prof.lokasi+'.');
  if(prof.layananUnggulan) kekuatan.push('Layanan/spesialisasi unggulan: '+prof.layananUnggulan+'.');
  if(prof.fasilitas) kekuatan.push('Fasilitas & peralatan: '+prof.fasilitas+'.');
  if(prof.kerjasama) kekuatan.push('Kerja sama & faktor lain: '+prof.kerjasama+'.');
  if(inRange(c.BOR,60,85)) kekuatan.push('Tingkat hunian tempat tidur (BOR '+fmt1(c.BOR)+'%) berada pada rentang ideal, menunjukkan pemanfaatan kapasitas rawat inap yang efisien.');
  else if(c.BOR<60) kelemahan.push('BOR sebesar '+fmt1(c.BOR)+'% berada di bawah standar ideal (60–85%), mengindikasikan kapasitas tempat tidur belum termanfaatkan optimal.');
  else kelemahan.push('BOR sebesar '+fmt1(c.BOR)+'% melebihi standar ideal (60–85%), berisiko menurunkan mutu pelayanan dan meningkatkan risiko infeksi nosokomial.');
  if(inRange(c.LOS,6,9)) kekuatan.push('Rata-rata lama rawat (LOS '+fmt1(c.LOS)+' hari) berada pada rentang ideal, menunjukkan efisiensi proses perawatan.');
  else kelemahan.push('LOS sebesar '+fmt1(c.LOS)+' hari berada di luar rentang ideal (6–9 hari), perlu evaluasi proses klinis dan discharge planning.');
  if(c.GDR<45 && c.NDR<25) kekuatan.push('Angka kematian GDR ('+fmt1(c.GDR)+'‰) dan NDR ('+fmt1(c.NDR)+'‰) berada di bawah ambang standar, menunjukkan mutu keselamatan pasien yang terjaga.');
  else ancaman.push('Angka kematian (GDR '+fmt1(c.GDR)+'‰ / NDR '+fmt1(c.NDR)+'‰) mendekati atau melebihi ambang standar, berpotensi menjadi risiko reputasi dan mutu layanan.');
  if(topAsr && topAsr.jumlah>0){
    const p = pct(topAsr.jumlah, sum(data.asuransi,'jumlah'));
    if(p>70) ancaman.push('Ketergantungan tinggi pada satu sumber penjamin ('+topAsr.nama+', '+fmt1(p)+'% dari total) meningkatkan risiko keuangan bila terjadi perubahan kebijakan penjamin tersebut.');
    else kekuatan.push('Komposisi sumber pembiayaan pasien cukup terdiversifikasi antar penjamin, mengurangi ketergantungan pada satu sumber pendapatan.');
  }
  const poliWithTarget = data.poli.filter(p=>Number(p.target)>0);
  if(poliWithTarget.length){
    const totalRealPoli = sum(poliWithTarget,'jumlah'), totalTargetPoli = sum(poliWithTarget,'target');
    const capTotal = pct(totalRealPoli, totalTargetPoli);
    if(capTotal>=100){
      kekuatan.push('Capaian kunjungan rawat jalan (poli spesialis) terhadap target keseluruhan mencapai '+fmt1(capTotal)+'% ('+fmt(totalRealPoli)+' dari target '+fmt(totalTargetPoli)+'), menunjukkan permintaan layanan rawat jalan yang sehat.');
    } else {
      kelemahan.push('Capaian kunjungan rawat jalan (poli spesialis) terhadap target keseluruhan baru '+fmt1(capTotal)+'% ('+fmt(totalRealPoli)+' dari target '+fmt(totalTargetPoli)+'), masih ada gap '+fmt(totalTargetPoli-totalRealPoli)+' kunjungan yang perlu dikejar.');
    }
    const belumSorted = poliWithTarget.filter(p=>Number(p.jumlah)<Number(p.target)).sort((a,b)=>(b.target-b.jumlah)-(a.target-a.jumlah));
    if(belumSorted.length){
      const top3 = belumSorted.slice(0,3);
      const daftarGap = top3.map(p=>`${p.nama} (${fmt1(pct(p.jumlah,p.target))}%, kurang ${fmt(p.target-p.jumlah)} kunjungan)`).join('; ');
      const modalKekuatan = [];
      if(prof.lokasi) modalKekuatan.push('lokasi strategis ('+prof.lokasi+')');
      if(prof.layananUnggulan) modalKekuatan.push('layanan unggulan ('+prof.layananUnggulan+')');
      if(prof.fasilitas) modalKekuatan.push('fasilitas yang tersedia ('+prof.fasilitas+')');
      if(prof.kerjasama) modalKekuatan.push('jejaring kerja sama ('+prof.kerjasama+')');
      const kalimatModal = modalKekuatan.length
        ? ' Manfaatkan modal kekuatan yang sudah dimiliki — '+modalKekuatan.join(', ')+' — sebagai daya tarik promosi dan materi komunikasi ke faskes rujukan.'
        : '';
      peluang.push('RENCANA AKSI RAWAT JALAN — poli dengan gap terbesar dari target: '+daftarGap+'. Langkah yang disarankan agar target tercapai: '
        +'(1) Evaluasi & tambah slot/jadwal praktik dokter spesialis pada poli yang capaiannya paling rendah, termasuk kemungkinan jadwal sore/akhir pekan; '
        +'(2) Perkuat koordinasi rujukan berjenjang dengan faskes primer (Puskesmas/klinik jejaring) bervolume besar agar rujukan lebih terarah ke poli yang masih jauh dari target; '
        +'(3) Tingkatkan promosi layanan spesialis (media RS, media sosial, edukasi ke faskes rujukan) khususnya pada poli dengan proporsi pasien baru rendah; '
        +'(4) Evaluasi alur pendaftaran, waktu tunggu, dan sistem antrian daring rawat jalan agar tidak menjadi hambatan kunjungan; '
        +'(5) Lakukan monitoring capaian target rawat jalan per poli setiap akhir bulan agar intervensi dapat diambil lebih cepat pada bulan berikutnya; '
        +'(6) Pertimbangkan kerja sama lintas poli (rujukan internal) bila ada indikasi diagnosa yang tumpang tindih antar spesialisasi.'
        +kalimatModal);
    } else {
      peluang.push('Seluruh poli rawat jalan dengan target sudah tercapai bulan ini — pertahankan jadwal praktik dan jejaring rujukan yang berjalan, serta jadikan sebagai standar acuan (benchmark) untuk poli lain.');
    }
    const rowsBaruAll = data.poli.filter(p=>Number(p.jumlah)>0);
    if(rowsBaruAll.length){
      const persenBaruAll = pct(sum(rowsBaruAll,'pasienBaru'), sum(rowsBaruAll,'jumlah'));
      if(persenBaruAll<20) peluang.push('Proporsi pasien baru rawat jalan tergolong rendah (di bawah 20%) — perluas jangkauan promosi dan kerja sama rujukan untuk menjaring pasien baru, tidak hanya mengandalkan kunjungan kontrol/lama.');
    }
  }
  if(data.faskes.filter(f=>f.jumlah>0).length>=3) peluang.push('Jejaring rujukan dari berbagai fasilitas kesehatan primer dapat dikembangkan lebih lanjut melalui kerja sama formal dan sistem rujukan digital.');
  else peluang.push('Jejaring rujukan faskes primer masih terbatas — peluang untuk memperluas kerja sama dengan Puskesmas dan klinik di wilayah sekitar.');
  peluang.push('Digitalisasi rekam medis dan pelaporan bulanan otomatis dapat mempercepat pengambilan keputusan manajemen.');
  ancaman.push('Perubahan regulasi tarif BPJS/asuransi dan persaingan antar fasilitas kesehatan di wilayah sekitar.');
  const kekuatanKualitatifCount = [prof.lokasi,prof.layananUnggulan,prof.fasilitas,prof.kerjasama].filter(Boolean).length;
  if(totalKunjungan===0){ kelemahan.length=0; kekuatan.length=kekuatanKualitatifCount; ancaman.length=0; kelemahan.push('Data kunjungan bulan ini belum diisi — lengkapi data pada menu Kunjungan & Poli untuk analisa yang lebih akurat.'); }
  const bullets = a => a.map(x=>'• '+x).join('\n');
  return {
    kekuatan: bullets(kekuatan.length?kekuatan:['Belum ada data cukup untuk menilai kekuatan.']),
    kelemahan: bullets(kelemahan.length?kelemahan:['Belum ada data cukup untuk menilai kelemahan.']),
    peluang: bullets(peluang),
    ancaman: bullets(ancaman.length?ancaman:['Belum teridentifikasi ancaman signifikan.']),
  };
}
function renderSwot(){

  const p = data.profil || {lokasi:'',layananUnggulan:'',fasilitas:'',kerjasama:''};
  return `

let lapCharts = {};
afterRenderHooks.laporan = async function(){
  renderAllBarcodes(document.getElementById('main'));

  Object.keys(lapCharts).forEach(k=>{ if(lapCharts[k]) lapCharts[k].destroy(); });
  const palette = ['#14524E','#B8722E','#2E5B9C','#9C2E2E','#5C8A3A','#7A5CA8','#C99A2E','#3A8A85'];
  // dri/drj tidak diwariskan dari renderLaporan() (beda fungsi/scope) — hitung ulang di sini
  const dri = topN(data.diagnosaRI,10), drj = topN(data.diagnosaRJ,10);

  const asrCtx = document.getElementById('chartLapAsuransi');
  const asr = data.asuransi.filter(a=>Number(a.jumlah)>0);
  if(asrCtx && asr.length){
    lapCharts.asuransi = new Chart(asrCtx, {
      type:'doughnut',
      data:{ labels: asr.map(a=>a.nama), datasets:[{data:asr.map(a=>a.jumlah), backgroundColor:palette}] },
      options:{ plugins:{legend:{position:'bottom', labels:{boxWidth:11,font:{size:10.5}}},
        datalabels:{display:true, color:'#fff', font:{size:10,weight:'700'}, formatter:v=>dlNum(v)}} }
    });
  }

  const poliCtx = document.getElementById('chartLapPoli');
  const poli = data.poli.filter(p=>p.nama);
  if(poliCtx && poli.length){
    lapCharts.poli = new Chart(poliCtx, {
      type:'bar',
      data:{ labels: poli.map(p=>p.nama), datasets:[
        {label:'Realisasi', data:poli.map(p=>p.jumlah), backgroundColor:'#14524E'},
        {label:'Target', data:poli.map(p=>p.target||0), backgroundColor:'#D8DCD2'},
      ]},
      options:{ plugins:{legend:{position:'bottom', labels:{boxWidth:11,font:{size:10.5}}},
        datalabels:{display:true, align:'top', anchor:'end', font:{size:8,weight:'600'}, color:'#182524', formatter:v=>dlNum(v)}},
        scales:{x:{ticks:{font:{size:9}}}, y:{beginAtZero:true}} }
    });
  }

  const driCtx = document.getElementById('chartLapDiagRI');
  if(driCtx && dri.length){
    lapCharts.dri = new Chart(driCtx, {
      type:'bar',
      data:{ labels: dri.map(d=>d.kode? d.kode+' - '+d.nama : d.nama), datasets:[{data:dri.map(d=>d.jumlah), backgroundColor:'#14524E'}] },
      options:{ indexAxis:'y', plugins:{legend:{display:false},
        datalabels:{display:true, anchor:'end', align:'end', font:{size:9,weight:'600'}, color:'#182524', formatter:v=>dlNum(v)}},
        scales:{x:{beginAtZero:true}, y:{ticks:{font:{size:9}}}} }
    });
  }

  const drjCtx = document.getElementById('chartLapDiagRJ');
  if(drjCtx && drj.length){
    lapCharts.drj = new Chart(drjCtx, {
      type:'bar',
      data:{ labels: drj.map(d=>d.kode? d.kode+' - '+d.nama : d.nama), datasets:[{data:drj.map(d=>d.jumlah), backgroundColor:'#B8722E'}] },
      options:{ indexAxis:'y', plugins:{legend:{display:false},
        datalabels:{display:true, anchor:'end', align:'end', font:{size:9,weight:'600'}, color:'#182524', formatter:v=>dlNum(v)}},
        scales:{x:{beginAtZero:true}, y:{ticks:{font:{size:9}}}} }
    });
  }

  // Tren statistik efisiensi & kunjungan antar bulan (sampai dengan bulan laporan ini)
  const bulanTren = (await getSavedMonths()).filter(m=>m<=currentMonth);
  const trenLabels=[], trenBOR=[], trenLOS=[], trenTOI=[], trenBTOtahun=[], trenGDR=[], trenNDR=[];
  const trenInap=[], trenJalan=[], trenIgd=[];
  const trenAsrPerBulan=[]; // array of data.asuransi arrays, per bulan (urutan sama dengan trenLabels) — Rawat Jalan
  const trenAsrRanapPerBulan=[]; // idem untuk Rawat Inap (data.asuransiRanap)
  for(const m of bulanTren){
    const d = await fetchMonthData(m);
    if(!d) continue;
    const ce = calcEfisiensi(d, m);
    trenLabels.push(monthLabel(m));
    trenBOR.push(Number(ce.BOR.toFixed(2)));
    trenLOS.push(Number(ce.LOS.toFixed(2)));
    trenTOI.push(Number(ce.TOI.toFixed(2)));
    trenBTOtahun.push(Number(ce.BTOtahun.toFixed(2)));
    trenGDR.push(Number(ce.GDR.toFixed(2)));
    trenNDR.push(Number(ce.NDR.toFixed(2)));
    trenInap.push(Number(d.rawatInap)||0);
    trenJalan.push(Number(d.rawatJalan)||0);
    trenIgd.push(Number(d.igd)||0);
    trenAsrPerBulan.push(Array.isArray(d.asuransi) ? d.asuransi : []);
    trenAsrRanapPerBulan.push(Array.isArray(d.asuransiRanap) ? d.asuransiRanap : []);
  }
  const lapLineOpts = ()=>({ plugins:{legend:{position:'bottom', labels:{boxWidth:10,font:{size:9}}},
    datalabels:{display:true, align:'top', font:{size:7,weight:'600'},
      color:(ctx)=>ctx.dataset.borderColor||ctx.dataset.backgroundColor, formatter:v=>dlNum(v)}},
    scales:{ x:{ticks:{font:{size:8}}}, y:{beginAtZero:true, ticks:{font:{size:9}}} } });

  const lapKunjCtx = document.getElementById('chartLapTrenKunjungan');
  if(lapKunjCtx && trenLabels.length) lapCharts.trenKunj = new Chart(lapKunjCtx, { type:'line',
    data:{ labels:trenLabels, datasets:[
      { label:'Rawat Inap', data:trenInap, borderColor:'#14524E', backgroundColor:'#14524E22', tension:.3, fill:true },
      { label:'Rawat Jalan', data:trenJalan, borderColor:'#B8722E', backgroundColor:'#B8722E22', tension:.3, fill:true },
      { label:'IGD', data:trenIgd, borderColor:'#A13D3D', backgroundColor:'#A13D3D22', tension:.3, fill:true },
    ]}, options: lapLineOpts() });

  // Tren kunjungan per penjamin/asuransi — Rawat Jalan
  function buildAsrTrend(perBulanArr, canvasId, narasiId){
    const names = [...new Set(perBulanArr.flatMap(arr=>arr.map(a=>a.nama)).filter(Boolean))];
    const datasets = names.map((nama,idx)=>({
      label: nama,
      data: perBulanArr.map(arr=>{ const f = arr.find(a=>a.nama===nama); return f ? (Number(f.jumlah)||0) : 0; }),
      borderColor: palette[idx % palette.length],
      backgroundColor: palette[idx % palette.length]+'22',
      tension:.3,
    }));
    const ctx = document.getElementById(canvasId);
    let chartObj = null;
    if(ctx && trenLabels.length && names.length){
      chartObj = new Chart(ctx, { type:'line', data:{ labels:trenLabels, datasets }, options: lapLineOpts() });
    }
    const narasiEl = document.getElementById(narasiId);
    if(narasiEl){
      if(datasets.length && trenLabels.length>=2){
        const iAkhir = trenLabels.length-1, iSebelum = iAkhir-1;
        const baris = datasets.map(ds=>{
          const now=ds.data[iAkhir], prev=ds.data[iSebelum], diff=now-prev;
          const arrow = diff>0?'▲ naik':diff<0?'▼ turun':'▬ tetap';
          const pctChange = prev!==0 ? Math.abs(diff/prev*100) : (now>0?100:0);
          return `<li><b>${ds.label}</b>: ${fmt(prev)} (${trenLabels[iSebelum]}) → ${fmt(now)} (${trenLabels[iAkhir]}) — ${arrow} ${fmt(Math.abs(diff))} kunjungan (${fmt1(pctChange)}%)</li>`;
        }).join('');
        narasiEl.innerHTML = `<div style="font-weight:600; margin-bottom:4px;">Perubahan ${trenLabels[iSebelum]} → ${trenLabels[iAkhir]}:</div><ul style="margin:0; padding-left:18px;">${baris}</ul>`;
      } else {
        narasiEl.innerHTML = '';
      }
    }
    return chartObj;
  }
  lapCharts.trenAsr = buildAsrTrend(trenAsrPerBulan, 'chartLapTrenAsuransi', 'lapAsrTrenNarasi');
  lapCharts.trenAsrRanap = buildAsrTrend(trenAsrRanapPerBulan, 'chartLapTrenAsuransiRanap', 'lapAsrRanapTrenNarasi');

  const lapBorCtx = document.getElementById('chartLapTrenBOR');
  if(lapBorCtx && trenLabels.length) lapCharts.trenBor = new Chart(lapBorCtx, { type:'line',
    data:{ labels:trenLabels, datasets:[{ label:'BOR (%)', data:trenBOR, borderColor:'#14524E', backgroundColor:'#14524E22', fill:true, tension:.3 }] },
    options: lapLineOpts() });

  const lapAlosCtx = document.getElementById('chartLapTrenALOSTOI');
  if(lapAlosCtx && trenLabels.length) lapCharts.trenAlos = new Chart(lapAlosCtx, { type:'line',
    data:{ labels:trenLabels, datasets:[
      { label:'ALOS', data:trenLOS, borderColor:'#14524E', backgroundColor:'#14524E22', tension:.3 },
      { label:'TOI', data:trenTOI, borderColor:'#B8722E', backgroundColor:'#B8722E22', tension:.3 },
    ]}, options: lapLineOpts() });

  const lapBtoCtx = document.getElementById('chartLapTrenBTO');
  if(lapBtoCtx && trenLabels.length) lapCharts.trenBto = new Chart(lapBtoCtx, { type:'bar',
    data:{ labels:trenLabels, datasets:[{ label:'BTO', data:trenBTOtahun, backgroundColor:'#14524E' }] },
    options: lapLineOpts() });

  const lapGdrCtx = document.getElementById('chartLapTrenGDRNDR');
  if(lapGdrCtx && trenLabels.length) lapCharts.trenGdr = new Chart(lapGdrCtx, { type:'line',
    data:{ labels:trenLabels, datasets:[
      { label:'GDR', data:trenGDR, borderColor:'#A13D3D', backgroundColor:'#A13D3D22', tension:.3 },
      { label:'NDR', data:trenNDR, borderColor:'#B8722E', backgroundColor:'#B8722E22', tension:.3 },
    ]}, options: lapLineOpts() });
};

    <div id="addMonthMsg" style="font-size:12px; color:var(--ink-soft); margin-top:8px;"></div>
  </div>
  <div class="card"><ul class="histlist" id="histlist"><li class="empty">Memuat riwayat…</li></ul></div>

async function addNewMonth(){
  const inp = document.getElementById('newMonthInput');
  const msg = document.getElementById('addMonthMsg');
  const m = inp.value;
  if(!m){ msg.textContent = 'Pilih bulan terlebih dahulu.'; msg.style.color = 'var(--danger)'; return; }
  const existing = await fetchMonthData(m);
  if(existing){
    msg.textContent = `Bulan ${monthLabel(m)} sudah ada datanya — langsung dibuka.`;
    msg.style.color = 'var(--ink-soft)';
  } else {
    const fresh = defaultData();
    await storeSet('bulan:'+m, JSON.stringify(fresh));
    let idx = await getSavedMonths();
    if(!idx.includes(m)){ idx.push(m); idx.sort(); }
    await storeSet('bulan-index', JSON.stringify(idx));
    msg.textContent = `Bulan ${monthLabel(m)} berhasil ditambahkan (data kosong, siap diisi).`;
    msg.style.color = 'var(--ok)';
  }
  currentMonth = m;
  activeTab = 'kunjungan';
  await loadMonth(m);
}
async function fetchMonthData(m){
  try{ const r = await storeGet('bulan:'+m); return r&&r.value? JSON.parse(r.value):null; }catch(e){ return null; }
}
async function getSavedMonths(){
  try{ const r = await storeGet('bulan-index'); const idx = r&&r.value? JSON.parse(r.value):[]; return idx.sort(); }catch(e){ return []; }
}
async function deleteMonthData(m, btn){
  if(btn.dataset.confirm !== '1'){
    btn.dataset.confirm = '1';
    btn.textContent = 'Yakin? Klik lagi';
    setTimeout(()=>{ btn.dataset.confirm=''; btn.textContent='Hapus'; }, 3000);
    return;
  }
  try{
    await storeDelete('bulan:'+m);
    await storeSet('bulan-deleted:'+m, '1'); // tandai agar data awal tidak muncul lagi
    let idx = await getSavedMonths();
    idx = idx.filter(x=>x!==m);
    await storeSet('bulan-index', JSON.stringify(idx));
    if(m === currentMonth){ data = defaultData(); }
  }catch(e){ console.error('Gagal menghapus', e); }
  render();
  refreshMonthQuickPick();
}
afterRenderHooks.riwayat = async function(){
  const idx = (await getSavedMonths()).slice().reverse();
  const el = document.getElementById('histlist');
  if(idx.length===0){
    el.innerHTML = '<li class="empty">Belum ada data tersimpan. Isi data lalu klik "Simpan Data Bulan Ini".</li>';
    return;
  }
  const rows = [];
  for(const m of idx){
    const d = await fetchMonthData(m);
    const total = d ? (Number(d.rawatInap||0)+Number(d.rawatJalan||0)) : 0;
    rows.push(`<li><span>${monthLabel(m)} <span class="mono" style="color:var(--ink-soft);font-size:11.5px;">— ${fmt(total)} kunjungan</span></span>
      <span style="display:flex; gap:14px; align-items:center;">
        <span class="hact" data-load="${m}">Buka →</span>
        <button class="rowbtn hact-del" data-delmonth="${m}" style="font-size:12px;">Hapus</button>
      </span></li>`);
  }
  el.innerHTML = rows.join('');
  el.querySelectorAll('[data-load]').forEach(b=>{
    b.addEventListener('click', ()=>{ currentMonth = b.dataset.load; activeTab='dashboard'; loadMonth(currentMonth); });
  });
  el.querySelectorAll('[data-delmonth]').forEach(b=>{
    b.addEventListener('click', ()=> deleteMonthData(b.dataset.delmonth, b));
  });
};

function refreshPercentInline(){
  // cheap partial refresh for percentage columns / bars without destroying focus
  if(activeTab==='kunjungan'){
    const total = sum(data.asuransi,'jumlah');
    document.querySelectorAll('#asuransiBody tr').forEach((tr,i)=>{
      const cell = tr.children[2];
      if(cell) cell.textContent = fmt1(pct(data.asuransi[i].jumlah,total))+'%';
    });
    const totalRanap = sum(data.asuransiRanap||[],'jumlah');
    document.querySelectorAll('#asuransiRanapBody tr').forEach((tr,i)=>{
      const cell = tr.children[2];
      if(cell) cell.textContent = fmt1(pct(data.asuransiRanap[i].jumlah,totalRanap))+'%';
    });
    const totalIgd = sum(data.asuransiIgd||[],'jumlah');
    document.querySelectorAll('#asuransiIgdBody tr').forEach((tr,i)=>{
      const cell = tr.children[2];
      if(cell) cell.textContent = fmt1(pct(data.asuransiIgd[i].jumlah,totalIgd))+'%';
    });
    const gabBody = document.getElementById('asuransiGabunganBody');
    if(gabBody){
      const gabungan = gabunganAsuransi();
      const totalGab = sum(gabungan,'jumlah');
      gabBody.querySelectorAll('tr').forEach((tr,i)=>{
        const g = gabungan[i]; if(!g) return;
        tr.children[1].textContent = fmt(g.jumlah);
        tr.children[2].textContent = fmt1(pct(g.jumlah,totalGab))+'%';
      });
    }
  }
  if(activeTab==='poli'){
    const total = sum(data.poli,'jumlah');
    const totalTarget = sum(data.poli,'target');
    const totalBaruAll = sum(data.poli,'pasienBaru');
    const trs = document.querySelectorAll('#main table tbody')[0].querySelectorAll('tr');
    trs.forEach((tr,i)=>{
      const p = data.poli[i]; if(!p) return;
      const cap = capaianStatus(p.jumlah, p.target);
      const lama = Math.max(0, Number(p.jumlah||0) - Number(p.pasienBaru||0));
      const persenBaru = pct(p.pasienBaru, p.jumlah);
      tr.children[3].textContent = fmt(lama);
      tr.children[4].textContent = p.jumlah>0 ? fmt1(persenBaru)+'%' : '-';
      tr.children[6].innerHTML = cap.pct===null ? `<span style="font-size:11.5px;color:var(--ink-soft);">${cap.label}</span>` : `<span class="mono" style="font-size:12px;">${fmt1(cap.pct)}%</span><span class="pill ${cap.cls}">${cap.label}</span>`;
    });
    const totRow = document.querySelectorAll('#main table tbody')[1]?.querySelector('tr');
    if(totRow){
      totRow.children[1].textContent = fmt(total);
      totRow.children[2].textContent = fmt(totalBaruAll);
      totRow.children[3].textContent = fmt(Math.max(0,total-totalBaruAll));
      totRow.children[4].textContent = total>0 ? fmt1(pct(totalBaruAll,total))+'%' : '-';
      totRow.children[5].textContent = fmt(totalTarget);
      totRow.children[6].textContent = totalTarget>0 ? fmt1(pct(total,totalTarget))+'%' : '-';
    }
    const analisaBox = document.querySelectorAll('#main .card')[1]?.querySelector('ul');
    if(analisaBox) analisaBox.innerHTML = analyzePoli().map(a=>`<li>${a}</li>`).join('');
  }
  if(activeTab==='faskes'){
    const total = sum(data.faskes,'jumlah');
    document.querySelectorAll('#main table tbody tr').forEach((tr,i)=>{
      if(!data.faskes[i]) return;
      const cell = tr.children[2];
      if(cell) cell.textContent = fmt1(pct(data.faskes[i].jumlah,total))+'%';
    });
  }
  if(activeTab==='asuransiPoli'){
    const rows = data.asuransiPerPoli;
    const totBpjs = sum(rows,'bpjs'), totUmum = sum(rows,'umum'), totKpgs = sum(rows,'kpgs'), totKet = sum(rows,'bpjsKet');
    const grandTotal = totBpjs+totUmum+totKpgs+totKet;
    const rowTotal = r => Number(r.bpjs||0)+Number(r.umum||0)+Number(r.kpgs||0)+Number(r.bpjsKet||0);
    const trs = document.querySelectorAll('#main table tbody')[0].querySelectorAll('tr');
    trs.forEach((tr,i)=>{
      const r = rows[i]; if(!r) return;
      const totalBaris = rowTotal(r);
      tr.children[2].textContent = totalBaris>0 ? fmt1(pct(r.bpjs,totalBaris))+'%' : '-';
      tr.children[4].textContent = totalBaris>0 ? fmt1(pct(r.umum,totalBaris))+'%' : '-';
      tr.children[6].textContent = totalBaris>0 ? fmt1(pct(r.kpgs,totalBaris))+'%' : '-';
      tr.children[8].textContent = totalBaris>0 ? fmt1(pct(r.bpjsKet,totalBaris))+'%' : '-';
      tr.children[9].textContent = fmt(totalBaris);
    });
    const totRow = document.querySelectorAll('#main table tbody')[1]?.querySelector('tr');
    if(totRow){
      totRow.children[1].textContent = fmt(totBpjs);
      totRow.children[2].textContent = grandTotal>0?fmt1(pct(totBpjs,grandTotal))+'%':'-';
      totRow.children[3].textContent = fmt(totUmum);
      totRow.children[4].textContent = grandTotal>0?fmt1(pct(totUmum,grandTotal))+'%':'-';
      totRow.children[5].textContent = fmt(totKpgs);
      totRow.children[6].textContent = grandTotal>0?fmt1(pct(totKpgs,grandTotal))+'%':'-';
      totRow.children[7].textContent = fmt(totKet);
      totRow.children[8].textContent = grandTotal>0?fmt1(pct(totKet,grandTotal))+'%':'-';
      totRow.children[9].textContent = fmt(grandTotal);
    }
    const crossTrs = document.querySelectorAll('#crossTableBody tr');
    crossTrs.forEach((tr,i)=>{
      const r = rows[i]; if(!r) return;
      const totalBaris = rowTotal(r);
      tr.children[1].textContent = totBpjs>0 ? fmt1(pct(r.bpjs,totBpjs))+'%' : '-';
      tr.children[2].textContent = totUmum>0 ? fmt1(pct(r.umum,totUmum))+'%' : '-';
      tr.children[3].textContent = totKpgs>0 ? fmt1(pct(r.kpgs,totKpgs))+'%' : '-';
      tr.children[4].textContent = totKet>0 ? fmt1(pct(r.bpjsKet,totKet))+'%' : '-';
      tr.children[5].textContent = grandTotal>0 ? fmt1(pct(totalBaris,grandTotal))+'%' : '-';
    });
  }
}

/* ================= AUTO-SEED: masukkan data awal sekali saja, lalu tetap tersimpan ================= */
async function ensureSeedData(){
  const statusEl = document.getElementById('seedStatus');
  let appliedList = [];
  try{
    const r = await storeGet('seed-applied');
    appliedList = r && r.value ? JSON.parse(r.value) : [];
  }catch(e){ appliedList = []; }

  let bulanIdx = await getSavedMonths();
  let touched = 0;

  for(const m of Object.keys(SEED_DATA)){
    if(appliedList.includes(m)) continue; // sudah pernah diproses — jangan timpa walau sudah diedit/dihapus user
    let existing = null;
    try{ const r = await storeGet('bulan:'+m); existing = r && r.value ? JSON.parse(r.value) : null; }catch(e){}
    if(!existing){
      // belum ada data tersimpan untuk bulan ini -> masukkan data awal & simpan permanen
      const seeded = defaultData();
      const s = SEED_DATA[m];
      if(s.efisiensi) Object.assign(seeded.efisiensi, s.efisiensi);
      if(s.rawatJalan!==undefined) seeded.rawatJalan = s.rawatJalan;
      if(s.rawatInap!==undefined) seeded.rawatInap = s.rawatInap;
      if(s.igd!==undefined) seeded.igd = s.igd;
      if(s.poli) seeded.poli = JSON.parse(JSON.stringify(s.poli));
      if(s.asuransi) seeded.asuransi = JSON.parse(JSON.stringify(s.asuransi));
      if(s.asuransiRanap) seeded.asuransiRanap = JSON.parse(JSON.stringify(s.asuransiRanap));
      if(s.asuransiIgd) seeded.asuransiIgd = JSON.parse(JSON.stringify(s.asuransiIgd));
      if(s.asuransiPerPoli) seeded.asuransiPerPoli = JSON.parse(JSON.stringify(s.asuransiPerPoli));
      if(s.faskes) seeded.faskes = JSON.parse(JSON.stringify(s.faskes));
      if(s.diagnosaRJ) seeded.diagnosaRJ = JSON.parse(JSON.stringify(s.diagnosaRJ));
      if(s.diagnosaRI) seeded.diagnosaRI = JSON.parse(JSON.stringify(s.diagnosaRI));
      try{
        await storeSet('bulan:'+m, JSON.stringify(seeded));
        if(!bulanIdx.includes(m)){ bulanIdx.push(m); }
        touched++;
      }catch(e){ console.error('Gagal menyimpan data awal', m, e); }
    }
    appliedList.push(m); // tandai selesai diproses — baik karena baru diisi maupun karena user sudah punya datanya sendiri
  }

  if(touched>0){
    bulanIdx.sort();
    try{
      await storeSet('bulan-index', JSON.stringify(bulanIdx));
      await storeSet('seed-applied', JSON.stringify(appliedList));
    }catch(e){ console.error('Gagal menyimpan indeks data awal', e); }
    if(statusEl) statusEl.textContent = `✓ ${touched} bulan data awal (Jan–Sep 2026) tersimpan otomatis.`;
    setTimeout(()=>{ if(statusEl) statusEl.textContent=''; }, 6000);
  } else if(appliedList.length>0){
    try{ await storeSet('seed-applied', JSON.stringify(appliedList)); }catch(e){}
  }

async function patchSeedGaps(){
  // Patch generik & menyeluruh — dijalankan SETIAP kali login (bukan sekali saja),
  // karena isinya sudah aman diulang (idempotent): hanya mengisi field yang MASIH
  // kosong/nol dengan nilai dari SEED_DATA, tidak pernah menimpa field yang sudah
  // berisi angka nyata (baik dari seed sebelumnya maupun editan manual pengguna).
  // Dengan begini, setiap kali saya menambah data baru ke SEED_DATA untuk bulan
  // yang sudah pernah tersimpan di perangkat pengguna, datanya tetap otomatis
  // terisi tanpa perlu bikin patch satu-satu lagi.
  const numSum = (obj, keys)=> keys.reduce((s,k)=> s+(Number(obj&&obj[k])||0), 0);
  const arrEmpty = (arr, keys)=> !Array.isArray(arr) || arr.length===0 || arr.every(item=> numSum(item,keys)===0);
  for(const m of Object.keys(SEED_DATA)){
    const s = SEED_DATA[m];
    try{
      const r = await storeGet('bulan:'+m);
      if(!(r && r.value)) continue; // belum ada sama sekali -> biar ensureSeedData yang menangani
      const d = JSON.parse(r.value);
      let changed = false;
      if(s.rawatInap!==undefined && !Number(d.rawatInap)){ d.rawatInap = s.rawatInap; changed = true; }
      if(s.rawatJalan!==undefined && !Number(d.rawatJalan)){ d.rawatJalan = s.rawatJalan; changed = true; }
      if(s.igd!==undefined && !Number(d.igd)){ d.igd = s.igd; changed = true; }
      if(s.poli && arrEmpty(d.poli, ['jumlah','pasienBaru','target'])){ d.poli = JSON.parse(JSON.stringify(s.poli)); changed = true; }
      if(s.asuransi && arrEmpty(d.asuransi, ['jumlah'])){ d.asuransi = JSON.parse(JSON.stringify(s.asuransi)); changed = true; }
      if(s.asuransiRanap && arrEmpty(d.asuransiRanap, ['jumlah'])){ d.asuransiRanap = JSON.parse(JSON.stringify(s.asuransiRanap)); changed = true; }
      if(s.asuransiIgd && arrEmpty(d.asuransiIgd, ['jumlah'])){ d.asuransiIgd = JSON.parse(JSON.stringify(s.asuransiIgd)); changed = true; }
      if(s.asuransiPerPoli && arrEmpty(d.asuransiPerPoli, ['bpjs','umum','kpgs'])){ d.asuransiPerPoli = JSON.parse(JSON.stringify(s.asuransiPerPoli)); changed = true; }
      if(s.faskes && arrEmpty(d.faskes, ['jumlah'])){ d.faskes = JSON.parse(JSON.stringify(s.faskes)); changed = true; }
      if(s.diagnosaRJ && arrEmpty(d.diagnosaRJ, ['jumlah'])){ d.diagnosaRJ = JSON.parse(JSON.stringify(s.diagnosaRJ)); changed = true; }
      if(s.diagnosaRI && arrEmpty(d.diagnosaRI, ['jumlah'])){ d.diagnosaRI = JSON.parse(JSON.stringify(s.diagnosaRI)); changed = true; }
      if(s.efisiensi){
        const efEmpty = numSum(d.efisiensi, ['tempatTidur','hariPerawatan','lamaDirawat','keluarHidup','keluarMati','mati48'])===0;
        if(efEmpty){ d.efisiensi = Object.assign({tempatTidur:0,hariPerawatan:0,lamaDirawat:0,keluarHidup:0,keluarMati:0,mati48:0}, s.efisiensi); changed = true; }
      }
      if(changed) await storeSet('bulan:'+m, JSON.stringify(d));
    }catch(e){ console.error('Gagal menambal data seed (generik)', m, e); }
  }
}

async function patchKunjunganResmi2026(){
  // Koreksi kunjungan berdasarkan file resmi "kunjungan_2026-1.xlsx" (Rawat Inap, Rawat Jalan, IGD Jan-Agu).
  // - Rawat Inap, Rawat Jalan & IGD semua bulan disamakan dengan file resmi.
  // - Agustus: Rawat Jalan 2.243 -> 2.119 (= total kunjungan poli non-radiologi). Rincian asuransi rawat jalan
  //   Agustus yang masih bernilai lama (BPJS 1.619, KPGS 6, UMUM 618) disesuaikan dengan asuransi per poli
  //   (BPJS 1.538, KPGS 5, UMUM 576; total 2.119) agar tidak bertentangan dengan total rawat jalan.
  try{
    const already = await storeGet('patch-kunjungan-resmi-2026-v1');
    if(already && already.value === '1') return;
  }catch(e){}
  const RESMI = {
    '2026-01': {rawatInap:383, rawatJalan:1596, igd:636},
    '2026-02': {rawatInap:316, rawatJalan:1609, igd:558},
    '2026-03': {rawatInap:332, rawatJalan:1436, igd:649},
    '2026-04': {rawatInap:389, rawatJalan:2082, igd:655},
    '2026-05': {rawatInap:400, rawatJalan:1876, igd:707},
    '2026-06': {rawatInap:489, rawatJalan:2327, igd:680},
    '2026-07': {rawatInap:506, rawatJalan:2237, igd:685},
    '2026-08': {rawatInap:472, rawatJalan:2119, igd:727},
  };
  for(const m of Object.keys(RESMI)){
    try{
      const r = await storeGet('bulan:'+m);
      if(!(r && r.value)) continue;
      const d = JSON.parse(r.value);
      const k = RESMI[m];
      let changed = false;
      ['rawatInap','rawatJalan','igd'].forEach(f=>{ if(Number(d[f])!==k[f]){ d[f] = k[f]; changed = true; } });
      if(m==='2026-08' && Array.isArray(d.asuransi)){
        const LAMA = {'BPJS':1619, 'KPGS Cikajang':6, 'UMUM':618};
        const BARU = {'BPJS':1538, 'KPGS Cikajang':5, 'UMUM':576};
        const masihLama = Object.keys(LAMA).every(n=>{ const a = d.asuransi.find(x=>x.nama===n); return a && Number(a.jumlah)===LAMA[n]; });
        if(masihLama){
          d.asuransi.forEach(a=>{ if(BARU[a.nama]!==undefined) a.jumlah = BARU[a.nama]; });
          changed = true;
        }
      }
      if(changed) await storeSet('bulan:'+m, JSON.stringify(d));
    }catch(e){ console.error('Gagal menambal kunjungan resmi', m, e); }
  }
  try{ await storeSet('patch-kunjungan-resmi-2026-v1', '1'); }catch(e){}
}

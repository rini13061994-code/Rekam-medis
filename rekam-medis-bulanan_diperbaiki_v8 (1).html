async function patchAsuransiRanapAgustus(){
  // Koreksi: sebelumnya tabel "Per Penjamin/Asuransi" bulan Agustus sempat ditimpa
  // menjadi TOTAL GABUNGAN rawat inap+rawat jalan (BPJS 2038, UMUM 642, LAPAD RUHAMA 11,
  // KPGS Cikajang 7, PT. Jasa Raharja Persero 1). Setelah diskusi lebih lanjut, keputusan
  // akhirnya: tabel rawat jalan dikembalikan ke nilai aslinya (BPJS 1619, KPGS Cikajang 6,
  // UMUM 618), dan data penjamin rawat inap dipisah ke tabel BARU (asuransiRanap):
  // BPJS 419, UMUM 24, LAPAD RUHAMA 11, KPGS Cikajang 1, PT. Jasa Raharja Persero 1.
  // Patch ini menimpa d.asuransi HANYA jika masih berisi nilai gabungan yang salah tsb
  // (menandakan belum sempat diedit manual oleh pengguna setelah salah patch sebelumnya),
  // dan mengisi d.asuransiRanap jika masih kosong.
  try{
    const already = await storeGet('patch-asuransi-ranap-agustus-v2');
    if(already && already.value === '1') return;
  }catch(e){}
  try{
    const r = await storeGet('bulan:2026-08');
    if(r && r.value){
      const d = JSON.parse(r.value);
      let changed = false;
      const totalAsr = Array.isArray(d.asuransi) ? d.asuransi.reduce((s,a)=>s+(Number(a.jumlah)||0),0) : 0;
      const adaLapad = Array.isArray(d.asuransi) && d.asuransi.some(a=>/lapad/i.test(a.nama||''));
      if(totalAsr===2699 || adaLapad){
        d.asuransi = [
          {nama:'BPJS', jumlah:1619},
          {nama:'KPGS Cikajang', jumlah:6},
          {nama:'UMUM', jumlah:618},
        ];
        changed = true;
      }
      const ranapKosong = !Array.isArray(d.asuransiRanap) || d.asuransiRanap.length===0 || d.asuransiRanap.every(a=>!Number(a.jumlah));
      if(ranapKosong){
        d.asuransiRanap = [
          {nama:'BPJS', jumlah:419},
          {nama:'UMUM', jumlah:24},
          {nama:'LAPAD RUHAMA', jumlah:11},
          {nama:'KPGS Cikajang', jumlah:1},
          {nama:'PT. Jasa Raharja Persero', jumlah:1},
        ];
        changed = true;
      }
      if(!Array.isArray(d.asuransiIgd) || d.asuransiIgd.length===0){
        // Excel tidak menyediakan rincian penjamin IGD — sediakan tabel kosong
        // (3 kategori standar) agar siap diisi manual oleh pengguna.
        d.asuransiIgd = [
          {nama:'BPJS', jumlah:0},
          {nama:'KPGS Cikajang', jumlah:0},
          {nama:'UMUM', jumlah:0},
        ];
        changed = true;
      }
      if(changed) await storeSet('bulan:2026-08', JSON.stringify(d));
    }
  }catch(e){ console.error('Gagal menambal asuransi rawat inap Agustus', e); }
  try{ await storeSet('patch-asuransi-ranap-agustus-v2', '1'); }catch(e){}
}
async function patchRevisiJuniJuliExcelBaru(){
  // Revisi Juni & Juli (file "juni_2026-3.xlsx" dan "juli_2026-2.xlsx"):
  // - Juni: Rawat Jalan 2.494 -> 2.327 (= total enam poli spesialis = total asuransi per poli);
  //   asuransi rawat jalan BPJS 1.762 -> 1.660 dan UMUM 721 -> 656 (KPGS tetap 11).
  // - Juli: Radiologi 631 -> 654 dan daftar Faskes Perujuk diganti dengan data Juli (sebelumnya salinan Juni).
  // Pasien baru Juli tidak diubah karena kolom ini di file Juli masih identik dengan Juni.
  // Target Poli Kulit dan Kelamin tetap 50 (permintaan pengguna sebelumnya).
  try{
    const already = await storeGet('patch-revisi-juni-juli-xlsx-v1');
    if(already && already.value === '1') return;
  }catch(e){}
  for(const m of ['2026-06','2026-07']){
    try{
      const r = await storeGet('bulan:'+m);
      const s = SEED_DATA[m];
      if(!(r && r.value && s)) continue;
      const d = JSON.parse(r.value);
      ['asuransi','asuransiRanap','asuransiPerPoli','diagnosaRJ','diagnosaRI','faskes'].forEach(k=>{
        d[k] = JSON.parse(JSON.stringify(s[k]));
      });
      d.rawatJalan = s.rawatJalan;
      d.rawatInap = s.rawatInap;
      if(!Array.isArray(d.poli)) d.poli = [];
      s.poli.forEach(x=>{
        const p = d.poli.find(y=>y.nama===x.nama);
        if(p){ p.jumlah = x.jumlah; }
        else { d.poli.push(JSON.parse(JSON.stringify(x))); }
      });
      await storeSet('bulan:'+m, JSON.stringify(d));
    }catch(e){ console.error('Gagal menambal revisi Juni/Juli (Excel baru)', m, e); }
  }
  try{ await storeSet('patch-revisi-juni-juli-xlsx-v1', '1'); }catch(e){}
}
